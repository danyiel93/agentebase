name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_falha:
        description: Demonstrar o bloqueio do deploy com um teste que falha
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependÃªncias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Checar sintaxe
        run: python -m py_compile agent.py app.py
      - name: Lint
        run: ruff check agent.py app.py

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependÃªncias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes unitÃ¡rios
        run: python -m pytest -m unitario -vv
      - name: Demonstrar falha controlada em um teste
        if: github.event_name == 'workflow_dispatch' && inputs.simular_falha
        run: |
          cat > "$RUNNER_TEMP/test_bloqueio_deploy.py" <<'PY'
          def test_bloqueio_deploy():
              assert False, "Falha controlada para demonstrar o bloqueio do deploy"
          PY
          python -m pytest "$RUNNER_TEMP/test_bloqueio_deploy.py" -vv

  test-contrato:
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependÃªncias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes de contrato
        run: python -m pytest -m contrato -vv

  test-run-level:
    needs: test-contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependÃªncias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes do loop do agente
        run: python -m pytest -m run_level -vv

  test-eval:
    needs: test-run-level
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependÃªncias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Smoke com a API real da OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Configure o secret OPENAI_API_KEY para rodar smoke e evals antes do deploy."
            exit 1
          fi
          python -m pytest -m smoke -vv
      - name: Evals do agente e das personas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pytest -m eval -vv

  deploy:
    needs: test-eval
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ESTRATEGIA != 'canary'
    uses: ./.github/workflows/deploy-azure.yml
    secrets:
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
