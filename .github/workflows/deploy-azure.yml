name: Deploy Azure

on:
  workflow_call:
    secrets:
      AZURE_WEBAPP_NAME:
        required: true
      AZURE_WEBAPP_PUBLISH_PROFILE:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checar secrets do Azure
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [[ -z "$AZURE_WEBAPP_NAME" || -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]]; then
            echo "::error::Configure AZURE_WEBAPP_NAME e AZURE_WEBAPP_PUBLISH_PROFILE antes do deploy."
            exit 1
          fi

      - name: Deploy no Azure Web App
        id: azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Verificar a saÃºde do Streamlit apÃ³s o deploy
        timeout-minutes: 5
        env:
          WEBAPP_URL: ${{ steps.azure.outputs.webapp-url }}
        run: |
          if [[ -z "$WEBAPP_URL" ]]; then
            echo "::error::O deploy nÃ£o informou a URL do aplicativo."
            exit 1
          fi

          health_url="$WEBAPP_URL/_stcore/health"
          response="$RUNNER_TEMP/streamlit-health.txt"
          for attempt in {1..18}; do
            if status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
                --output "$response" --write-out '%{http_code}' "$health_url") \
              && [[ "$status" == "200" && "$(< "$response")" == "ok" ]]; then
              echo "SaÃºde do Streamlit verificada: HTTP 200 e resposta ok."
              exit 0
            fi
            echo "Streamlit ainda indisponÃ­vel (tentativa $attempt de 18)."
            sleep 5
          done

          echo "::error::O endpoint de saÃºde do Streamlit nÃ£o respondeu HTTP 200 com ok."
          exit 1
